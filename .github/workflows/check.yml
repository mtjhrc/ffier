name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --component rustfmt,clippy
          rustup default stable

      - name: Install Miri
        if: runner.os == 'Linux'
        run: rustup toolchain install nightly --component miri,rustfmt

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind just

      - name: Install just on Windows
        if: runner.os == 'Windows'
        run: cargo install just --locked

      - name: just check
        run: just check

      - name: Generated-code diff summary
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        run: python3 tests/render-codegen-diff.py origin/${{ github.base_ref }}
