[package]
name = "ffier-test-compat"
version = "0.1.0"
edition = "2024"

[features]
ffier-dynlookup = ["dep:libloading"]
ffier-strong = ["ffier-test-foreign-lib-via-cdylib/ffier-strong"]
fruit-label = []
optional-entry = []

[dependencies]
libloading = { version = "0.8", optional = true }
bitflags = "2"
ffier = { package = "ffier-rt", path = "../../ffier-rt" }
ffier-test-foreign-lib-via-cdylib = { path = "../foreign-lib-via-cdylib" }

[build-dependencies]
# Build-dependency on the schema producer: cargo builds ffier-test-lib
# (writing target/ffier-ft.json via generate_bridge!) before this crate's
# build script runs, so a fresh `cargo test -p ffier-test-compat` works
# without a prior `just build`.
ffier-test-codegen = { path = "../codegen" }
ffier-test-lib = { path = "../lib" }
