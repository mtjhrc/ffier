[package]
name = "ffier-test-lib-via-cdylib"
version = "0.1.0"
edition = "2024"

[features]
ffier-dynlookup = ["dep:libloading", "ffier-test-foreign-lib-via-cdylib/ffier-dynlookup"]
ffier-strong = ["ffier-test-foreign-lib-via-cdylib/ffier-strong"]
fruit-label = []
optional-entry = []

[dependencies]
bitflags = "2"
ffier = { path = "../../ffier" }
ffier-test-foreign-lib-via-cdylib = { path = "../foreign-lib-via-cdylib" }
libloading = { version = "0.8", optional = true }

[build-dependencies]
# Build-dependency on the schema producer: cargo builds ffier-test-lib
# (writing target/ffier-ft.json via generate_bridge!) before this crate's
# build script runs, so a fresh `cargo test -p ffier-test-lib-via-cdylib`
# works without a prior `just build`.
ffier-test-codegen = { path = "../codegen" }
ffier-test-lib = { path = "../lib" }
