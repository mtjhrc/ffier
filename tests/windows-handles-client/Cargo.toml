[package]
name = "ffier-test-windows-handles-client"
version = "0.1.0"
edition = "2024"
publish = false

[features]
ffier-strong = []
ffier-dynlookup = ["dep:libloading"]

[dependencies]
libloading = { version = "0.8", optional = true }
ffier = { package = "ffier-rt", path = "../../ffier-rt" }

[build-dependencies]
ffier-gen-rust-client = { path = "../../ffier-gen-rust-client" }
ffier-test-windows-handles = { path = "../windows-handles" }
