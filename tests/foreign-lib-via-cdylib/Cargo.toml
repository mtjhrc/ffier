[package]
name = "ffier-test-foreign-lib-via-cdylib"
version = "0.1.0"
edition = "2024"

[features]
ffier-dynlookup = ["dep:libloading"]
ffier-strong = []

[dependencies]
libloading = { version = "0.8", optional = true }
ffier = { package = "ffier-rt", path = "../../ffier-rt" }

[build-dependencies]
# Build-dependency on the schema producer: cargo builds ffier-test-foreign-lib
# (writing target/ffier-fl.json via generate_bridge!) before this crate's
# build script runs, so a fresh `cargo test -p ffier-test-foreign-lib-via-cdylib`
# works without a prior `just build`.
ffier-test-codegen = { path = "../codegen" }
ffier-test-foreign-lib = { path = "../foreign-lib" }
