[package]
name = "ffier-test-compile-fail"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
ffier = { path = "../../ffier" }
ffier-test-lib = { path = "../lib", optional = true }
ffier-test-lib-via-cdylib = { path = "../lib-via-cdylib", optional = true }

[features]
native = ["dep:ffier-test-lib"]
via-cdylib = ["dep:ffier-test-lib-via-cdylib"]
thread_not_send = []
thread_not_sync = []
thread_not_send_sync = []
thread_not_static = []
thread_worker_escape = []
thread_handle_not_send = []
thread_handle_not_sync = []
thread_send_handle_not_sync = []
thread_sync_handle_not_send = []
thread_vtable_not_send = []
thread_vtable_not_sync = []
thread_send_vtable_not_sync = []
thread_sync_vtable_not_send = []
thread_callback_not_send = []
thread_callback_not_sync = []
thread_send_callback_not_sync = []
thread_sync_callback_not_send = []
thread_shared_send_not_send = []
thread_factory_wrong_guarantees = []
thread_raw_vtable_not_send = []
thread_raw_vtable_not_sync = []
thread_false_send = []
thread_false_sync = []
thread_stronger_bound = []
thread_shared_send = []
thread_supertrait = []
thread_where_bound = []
thread_method_bounds = []
thread_receiver_lifetime = []
thread_missing_annotation = []
thread_constrained_lifetime = []
thread_specialized_lifetime = []
thread_typed_receiver = []
thread_slice_lifetime = []
thread_inner_slice_lifetime = []
thread_raw_lifetime_bounds = []
thread_missing_definition = []
